name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: cargo clippy
        run: cargo clippy --all-targets --release -- -D warnings
        continue-on-error: true

      - name: cargo build --release
        run: cargo build --release

      - name: cargo test --release
        run: cargo test --release --bins

  swift:
    name: Swift — menubar widget compile check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Generate build-info.swift
        run: |
          cat > tools/menubar/build-info.swift <<'EOF'
          // Auto-generated by CI
          enum BuildInfo {
              static let commitHash: String = "${{ github.sha }}".prefix(7).description
              static let sourceHash: String = "ci-build"
              static let builtAt:    String = "${{ github.event.head_commit.timestamp }}"
          }
          EOF

      - name: swiftc compile check (no codesign)
        # swiftc requires the file containing top-level expressions to be
        # named `main.swift`. Copy the widget file under that name so
        # the compile check works without renaming the source.
        run: |
          cd tools/menubar
          mkdir -p /tmp/swiftbuild
          cp i-dream-bar.swift /tmp/swiftbuild/main.swift
          cp build-info.swift  /tmp/swiftbuild/build-info.swift
          cd /tmp/swiftbuild
          swiftc -O \
            -framework Cocoa \
            -framework UserNotifications \
            -o /tmp/i-dream-bar \
            main.swift build-info.swift
          ls -la /tmp/i-dream-bar
