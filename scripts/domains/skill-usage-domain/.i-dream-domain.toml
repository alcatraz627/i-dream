[domain]
name        = "skill-usage"
version     = "1.0"
description = "Skill invocations per session, from skills/usage/invocations.jsonl"
root        = "~/.claude/skill-usage-domain"

[event_stream]
path      = "{root}/events.jsonl"
format    = "jsonl"
id_field  = "id"
ts_field  = "ts"

[consolidation]
enabled = true
type    = "external_script"
script  = "{root}/extract-events.py"
cadence = "daily"
timeout = "60s"

[dream]
enabled = false
cadence = "weekly"
